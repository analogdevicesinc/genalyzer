name: Build and Publish Python Distributions

on: [push, pull_request]

permissions:
  contents: read

jobs:
  BuildSDist:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build pure Python API wheel and source distribution
        run: |
          python -m pip install --upgrade build
          cd bindings/python
          python -m build

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: genalyzer-sdist
          path: bindings/python/dist/*

  BuildFFTWheels:
    name: FFTW wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test GPL FFTW wheel variants
        uses: pypa/cibuildwheel@v2.23.3
        with:
          package-dir: bindings/python-fftw
          output-dir: wheelhouse

      - name: Upload platform wheels
        uses: actions/upload-artifact@v4
        with:
          name: genalyzer-fftw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  PublishPyPIBase:
    needs: [BuildSDist, BuildFFTWheels]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download genalyzer distributions
        uses: actions/download-artifact@v4
        with:
          name: genalyzer-sdist
          path: dist-genalyzer

      - name: Publish genalyzer to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-genalyzer

  PublishPyPIFFTW:
    needs: [PublishPyPIBase]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download genalyzer-fftw wheels
        uses: actions/download-artifact@v4
        with:
          pattern: genalyzer-fftw-wheels-*
          path: dist-genalyzer-fftw
          merge-multiple: true

      - name: Publish genalyzer-fftw to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-genalyzer-fftw
