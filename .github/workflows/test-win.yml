name: Windows Builds

on: [push, pull_request]

jobs:
  TestCWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup FFTW
        shell: powershell
        run: .\bindings\python\tools\cibw_install_fftw_windows.ps1

      - name: Build and test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DFFTW_INCLUDE_DIRS="$env:GITHUB_WORKSPACE\deps\fftw3" `
            -DFFTW_LIBRARIES="$env:GITHUB_WORKSPACE\deps\fftw3\libfftw3-3.lib" `
            -DPython3_EXECUTABLE:FILEPATH="$(python -c 'import sys; print(sys.executable)')" `
            -DPYTHON_BINDINGS=ON `
            -DBUILD_TESTS_EXAMPLES=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:GITHUB_WORKSPACE\build-win\bindings\c\src;$env:GITHUB_WORKSPACE\deps\fftw3;$env:PATH"
          ctest --test-dir build-win -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive generated DLLs
        uses: actions/upload-artifact@v4
        with:
          name: DLLs
          path: |
            build-win\bindings\c\src\libgenalyzer.dll
            build-win\bindings\c\src\libgenalyzer.lib

  BuildWindowsInstaller:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Inno Setup
        run: choco install --no-progress -y innosetup

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup FFTW
        shell: powershell
        run: .\bindings\python\tools\cibw_install_fftw_windows.ps1

      - name: Build library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DFFTW_INCLUDE_DIRS="$env:GITHUB_WORKSPACE\deps\fftw3" `
            -DFFTW_LIBRARIES="$env:GITHUB_WORKSPACE\deps\fftw3\libfftw3-3.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update installer runtime path
        shell: powershell
        run: .\.github\scripts\update_win_installer.ps1 -IssFilePath "$env:GITHUB_WORKSPACE\build-win\libgenalyzer.iss"

      # Build the managed assemblies (all target frameworks) and the NuGet
      # package so the installer's [Files] section can bundle them.
      - name: Build and pack C# binding
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build bindings/csharp/Genalyzer/Genalyzer.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet pack bindings/csharp/Genalyzer/Genalyzer.csproj -c Release -o bindings/csharp/nupkg --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "build-win\libgenalyzer.iss"
          dir
          dir C:\
        shell: cmd

      - name: Archive Windows exe installer
        uses: actions/upload-artifact@v4
        with:
          name: EXE-Installer
          path: C:\genalyzer-setup.exe

      - name: Download artifact installer
        uses: actions/download-artifact@v4
        with:
          name: EXE-Installer
          path: win_build

      - name: Post development build to GH releases page
        uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/main'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Latest Development Build"
          files: win_build
